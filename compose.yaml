
services:
  postgres:
    image: postgres:16
    container_name: multistop-postgres
    environment:
      POSTGRES_DB: multistop_db
      POSTGRES_USER: multistop_user
      POSTGRES_PASSWORD: 123
    ports:
      - "5433:5432"
    volumes:
      - multistop_data:/var/lib/postgresql/data

volumes:
  multistop_data:
